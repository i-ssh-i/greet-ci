name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Test & Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run Quality Check (Ruff)
        run: |
          uv run ruff check .

      - name: Run Tests / Execution
        run: |
          uv run python greet.py

      - name: Build Package
        run: |
          uv build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifact-${{ matrix.os }}
          path: dist/
